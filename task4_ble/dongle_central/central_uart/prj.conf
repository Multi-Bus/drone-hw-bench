# Enable the UART driver
CONFIG_UART_ASYNC_API=y
CONFIG_SERIAL=y
# NRFX_UARTE0 / CONSOLE / UART_CONSOLE are set per board in boards/*.conf (dongle: USB CDC ACM only)

# Enable the BLE stack with GATT Client configuration
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y

# Enable the BLE modules from NCS
CONFIG_BT_NUS_CLIENT=y
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1
CONFIG_BT_GATT_DM=y
# Task 4 Lv2 throughput: larger heap for UART buffers, MTU 247 and 251 B data length
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Task 4 Lv2 distance test: HCI Read RSSI is rejected (-EIO) unless the controller has connection RSSI on
CONFIG_BT_CTLR_CONN_RSSI=y

# This example requires more stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=1536

# Bonding storage (BT_SETTINGS) disabled: with it on, USB never enumerated on the dongle (see 삽질기록)
CONFIG_BT_SETTINGS=n
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Config logger
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n

CONFIG_ASSERT=y
