# nRF52840 Dongle: no UART pins to a host, use USB CDC ACM instead
# Same settings as peripheral_uart/prj_cdc.conf (USB CDC ACM + async adapter)
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_ADAPTER=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y

# Keep the CDC ACM port free for NUS data only
CONFIG_NRFX_UARTE0=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

# The dongle has no 32.768 kHz crystal: use the internal RC oscillator for the low-frequency clock
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
